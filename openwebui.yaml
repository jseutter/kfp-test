apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  labels:
    app: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
          env:
            # Points Open WebUI to your RHOAI vLLM endpoint
            - name: OPENAI_API_BASE_URL
              value: "http://<YOUR_VLLM_SERVICE_NAME>:8080/v1"
            # Disables login screen for the demo (remove for production)
            - name: WEBUI_AUTH
              value: "False"
          volumeMounts:
            - name: webui-data
              mountPath: /app/backend/data
      volumes:
        # Uses ephemeral storage to bypass OpenShift restricted SCC issues
        - name: webui-data
          emptyDir: {} 
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
spec:
  selector:
    app: open-webui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: open-webui
spec:
  to:
    kind: Service
    name: open-webui
  port:
    targetPort: 8080
